framework:
    messenger:
        failure_transport: failed
        transports:
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    max_retries: 3
                    delay: 5000      # 5 s, puis 15 s, puis 45 s
                    multiplier: 3
            failed: 'doctrine://default?queue_name=failed'
        routing:
            App\Message\QualifyTicket: async
